<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIALO QUEST &middot; Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter+Tight:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --bg-card: #111111; --line: #1f1f1f; --line-bright: #2a2a2a;
      --ink: #fafafa; --ink-2: #a3a3a3; --ink-3: #6b6b6b;
      --accent: #d4ff3a; --accent-2: #ff5e3a;
      --success: #4ade80; --warning: #fbbf24;
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter Tight', sans-serif;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; }
    .topbar { border-bottom: 1px solid var(--line); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark { width: 32px; height: 32px; border: 1.5px solid var(--ink); position: relative; transform: rotate(45deg); }
    .brand-mark::before { content: ''; position: absolute; inset: 5px; background: var(--accent-2); }
    .brand-text { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
    .brand-text span { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
    .topbar-status { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
    .topbar-status .green { color: var(--success); }

    .auth-screen { max-width: 460px; margin: 80px auto; padding: 40px; border: 1px solid var(--line); background: var(--bg-card); position: relative; }
    .auth-screen::before { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; height: 2px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .auth-eyebrow { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
    .auth-title { font-family: var(--sans); font-weight: 400; font-size: 32px; letter-spacing: -0.03em; margin-bottom: 12px; }
    .auth-title em { font-family: var(--serif); font-style: italic; color: var(--accent-2); }
    .auth-desc { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin-bottom: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .input-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
    .input { background: var(--bg); border: 1px solid var(--line-bright); color: var(--ink); padding: 14px 16px; font-family: var(--mono); font-size: 13px; outline: none; width: 100%; }
    .input:focus { border-color: var(--accent); }
    .btn { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 22px; border: none; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #0a0a0a; }
    .btn-primary:hover { background: var(--ink); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-banner { background: rgba(255,94,58,0.1); border: 1px solid rgba(255,94,58,0.4); color: var(--accent-2); padding: 12px 16px; margin-bottom: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.5; word-break: break-word; }

    .container { max-width: 1280px; margin: 0 auto; padding: 60px 32px 100px; }
    .header-bar { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; padding-bottom: 32px; margin-bottom: 32px; border-bottom: 1px solid var(--line); }
    .header-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.15em; margin-bottom: 8px; }
    .header-title { font-family: var(--sans); font-weight: 300; font-size: 48px; letter-spacing: -0.04em; line-height: 1; }
    .header-title em { font-family: var(--serif); font-style: italic; color: var(--accent-2); }
    .filter-tabs { display: flex; border: 1px solid var(--line-bright); }
    .filter-tab { background: transparent; border: none; color: var(--ink-3); font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 18px; cursor: pointer; border-right: 1px solid var(--line-bright); }
    .filter-tab:last-child { border-right: none; }
    .filter-tab.active { background: var(--accent); color: var(--bg); }
    .filter-tab .count { background: rgba(0,0,0,0.15); padding: 2px 7px; margin-left: 6px; font-size: 10px; }
    .filter-tab:not(.active) .count { background: var(--line); color: var(--ink-2); }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--ink-3); font-family: var(--mono); font-size: 12px; border: 1px dashed var(--line); }
    .empty-state .big { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

    .sub-card { border: 1px solid var(--line); background: var(--bg-card); padding: 24px; margin-bottom: 12px; }
    .sub-card.pending { border-left: 3px solid var(--warning); }
    .sub-card.approved { border-left: 3px solid var(--success); }
    .sub-card.rejected { border-left: 3px solid var(--accent-2); opacity: 0.7; }
    .sub-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; margin-bottom: 16px; }
    .sub-quest-tag { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
    .sub-quest-title { font-family: var(--sans); font-weight: 500; font-size: 18px; margin-bottom: 4px; }
    .sub-xp { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; }
    .sub-status-pill { font-family: var(--mono); font-size: 10px; padding: 5px 10px; border-radius: 99px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
    .sub-status-pill.pending { background: rgba(251,191,36,0.1); color: var(--warning); border: 1px solid rgba(251,191,36,0.3); }
    .sub-status-pill.approved { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
    .sub-status-pill.rejected { background: rgba(255,94,58,0.1); color: var(--accent-2); border: 1px solid rgba(255,94,58,0.3); }
    .sub-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; padding: 16px 20px; background: var(--bg); border: 1px solid var(--line); margin-bottom: 16px; font-family: var(--mono); font-size: 11px; }
    .sub-meta-label { color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    .sub-meta-value { color: var(--ink); word-break: break-all; }
    .sub-meta-value a { color: var(--accent); text-decoration: none; }
    .sub-meta-value a:hover { text-decoration: underline; }
    .sub-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .action-btn { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 18px; cursor: pointer; border: 1px solid; background: transparent; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .action-btn.approve { color: var(--success); border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
    .action-btn.approve:hover:not(:disabled) { background: var(--success); color: var(--bg); }
    .action-btn.reject { color: var(--accent-2); border-color: rgba(255,94,58,0.3); background: rgba(255,94,58,0.08); }
    .action-btn.reject:hover:not(:disabled) { background: var(--accent-2); color: var(--bg); }
    .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--bg-card); border: 1px solid var(--line-bright); border-left: 3px solid var(--accent); padding: 16px 22px; font-family: var(--mono); font-size: 12px; max-width: 380px; line-height: 1.5; }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--accent-2); }
    .toast a { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">RIALO <span>// ADMIN</span></div>
    </a>
    <div class="topbar-status" id="auth-status">&mdash; Locked</div>
  </header>

  <!-- LOGIN VIEW -->
  <div id="login-view">
    <div class="auth-screen">
      <div class="auth-eyebrow">// RESTRICTED ACCESS</div>
      <h1 class="auth-title">Admin <em>console</em></h1>
      <p class="auth-desc">Enter password to review pending submissions. Approving mints +XP onchain to the submitter's wallet.</p>
      <div id="login-error" style="display:none"></div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input type="password" class="input" id="pw-input" placeholder="Password" autocomplete="off" />
      </div>
      <button class="btn btn-primary" id="login-btn">Unlock Console</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <main class="container" id="dashboard-view" style="display:none">
    <div class="header-bar">
      <div>
        <div class="header-num">01 / SUBMISSIONS</div>
        <h1 class="header-title">Pending <em>review</em></h1>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="pending">Pending<span class="count" id="count-pending">0</span></button>
        <button class="filter-tab" data-filter="history">History<span class="count" id="count-history">0</span></button>
      </div>
    </div>
    <div id="submissions-list">
      <div class="empty-state">Loading...</div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // ─── CONFIG ───────────────────────────────────────
    var API_BASE = 'https://rialo-quest-9ny7.vercel.app/api/admin2';
    var FETCH_TIMEOUT_MS = 10000;
    var pw = null;
    var activeFilter = 'pending';

    // ─── UTILS ────────────────────────────────────────
    function showToast(msg, type, dur) {
      type = type || 'info'; dur = dur || 4500;
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast ' + type;
      t.innerHTML = msg;
      c.appendChild(t);
      setTimeout(function(){ t.remove(); }, dur);
    }

    function showError(msg) {
      var el = document.getElementById('login-error');
      el.className = 'error-banner';
      el.style.display = 'block';
      el.textContent = msg;
    }

    function clearError() {
      var el = document.getElementById('login-error');
      el.style.display = 'none';
      el.textContent = '';
    }

    function shortAddr(a) { return a.slice(0, 6) + '...' + a.slice(-4); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
    function formatDate(s) {
      try {
        var d = new Date(s);
        var diff = (new Date() - d) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
      } catch (e) { return s; }
    }

    // Fetch with timeout — guarantees we never hang silently
    function timedFetch(url) {
      return new Promise(function(resolve, reject) {
        var timedOut = false;
        var timer = setTimeout(function(){
          timedOut = true;
          reject(new Error('Request timed out after ' + (FETCH_TIMEOUT_MS / 1000) + 's. Server is unreachable.'));
        }, FETCH_TIMEOUT_MS);
        fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store' })
          .then(function(r){
            if (timedOut) return;
            clearTimeout(timer);
            resolve(r);
          })
          .catch(function(e){
            if (timedOut) return;
            clearTimeout(timer);
            reject(e);
          });
      });
    }

    // ─── LOGIN ────────────────────────────────────────
    function doLogin() {
      clearError();
      var input = document.getElementById('pw-input').value.trim();
      if (!input) { showError('Enter a password.'); return; }

      var btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Checking...';

      var url = API_BASE + '?secret=' + encodeURIComponent(input) + '&action=list&filter=pending';

      timedFetch(url)
        .then(function(r){
          if (r.status === 401) { showError('Invalid password.'); throw 'unauth'; }
          if (!r.ok) throw new Error('Server returned ' + r.status);
          return r.json();
        })
        .then(function(data){
          pw = input;
          sessionStorage.setItem('rialo_admin_pw', pw);
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'block';
          var statusEl = document.getElementById('auth-status');
          statusEl.innerHTML = '<span class="green">&bull; Unlocked</span>';
          render(data);
          showToast('<strong>Console unlocked</strong>', 'success');
          setInterval(loadSubmissions, 30000);
        })
        .catch(function(err){
          btn.disabled = false;
          btn.textContent = 'Unlock Console';
          if (err !== 'unauth') {
            showError('Login failed: ' + (err.message || err));
          }
        });
    }

    // ─── LOAD SUBMISSIONS ─────────────────────────────
    function loadSubmissions() {
      if (!pw) return;
      var url = API_BASE + '?secret=' + encodeURIComponent(pw) + '&action=list&filter=' + activeFilter;
      timedFetch(url)
        .then(function(r){ return r.json(); })
        .then(function(data){ render(data); })
        .catch(function(err){ showToast('Reload failed: ' + err.message, 'error'); });
    }

    function setFilter(f) {
      activeFilter = f;
      var tabs = document.querySelectorAll('.filter-tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].dataset.filter === f);
      loadSubmissions();
    }

    // ─── RENDER ───────────────────────────────────────
    function render(data) {
      var counts = data.counts || { pending: 0, history: 0 };
      document.getElementById('count-pending').textContent = counts.pending || 0;
      document.getElementById('count-history').textContent = counts.history || 0;

      var subs = data.submissions || [];
      var list = document.getElementById('submissions-list');

      if (subs.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="big">' + (activeFilter === 'pending' ? '&#9711;' : '&#10022;') + '</div>' + (activeFilter === 'pending' ? 'No pending submissions &middot; auto-refreshing every 30s' : 'No reviewed submissions yet') + '</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < subs.length; i++) {
        var sub = subs[i];
        var proofLink = (sub.proof || '').match(/^https?:\/\//)
          ? '<a href="' + escapeHtml(sub.proof) + '" target="_blank">' + escapeHtml(sub.proof) + ' &#8599;</a>'
          : escapeHtml(sub.proof);
        var txLink = sub.txHash
          ? '<a href="https://sepolia.basescan.org/tx/' + sub.txHash + '" target="_blank">' + sub.txHash.slice(0,10) + '...' + sub.txHash.slice(-8) + ' &#8599;</a>'
          : '';
        var isPending = sub.status === 'pending';

        html += '<div class="sub-card ' + sub.status + '">';
        html += '  <div class="sub-head">';
        html += '    <div>';
        html += '      <div class="sub-quest-tag">QUEST &middot; ' + escapeHtml(sub.questStringId) + '</div>';
        html += '      <div class="sub-quest-title">' + escapeHtml(sub.questTitle || sub.questStringId) + '</div>';
        html += '      <div class="sub-xp">+' + (sub.questXP || '?') + ' XP reward</div>';
        html += '    </div>';
        html += '    <div class="sub-status-pill ' + sub.status + '">' + escapeHtml(sub.status.replace('_', ' ')) + '</div>';
        html += '  </div>';
        html += '  <div class="sub-meta-grid">';
        html += '    <div><div class="sub-meta-label">Submitter Wallet</div><div class="sub-meta-value">' + shortAddr(sub.userAddress) + '</div></div>';
        html += '    <div><div class="sub-meta-label">Submitted</div><div class="sub-meta-value">' + formatDate(sub.submittedAt) + '</div></div>';
        html += '    <div style="grid-column: 1 / -1"><div class="sub-meta-label">Proof</div><div class="sub-meta-value">' + proofLink + '</div></div>';
        if (sub.txHash) {
          html += '    <div style="grid-column: 1 / -1"><div class="sub-meta-label">Mint Transaction</div><div class="sub-meta-value">' + txLink + '</div></div>';
        }
        html += '  </div>';
        if (isPending) {
          html += '  <div class="sub-actions">';
          html += '    <button class="action-btn approve" data-id="' + sub.id + '" data-action="approve">&#10003; Approve &middot; Mint</button>';
          html += '    <button class="action-btn reject" data-id="' + sub.id + '" data-action="reject">&#10007; Reject</button>';
          html += '  </div>';
        }
        html += '</div>';
      }
      list.innerHTML = html;

      // Wire up approve/reject buttons
      var actionBtns = list.querySelectorAll('.action-btn');
      for (var k = 0; k < actionBtns.length; k++) {
        actionBtns[k].addEventListener('click', function(e) {
          var b = e.currentTarget;
          review(b.dataset.id, b.dataset.action);
        });
      }
    }

    // ─── APPROVE / REJECT ─────────────────────────────
    function review(id, action) {
      var btns = document.querySelectorAll('.action-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

      var url = API_BASE + '?secret=' + encodeURIComponent(pw) + '&action=' + action + '&id=' + encodeURIComponent(id);
      timedFetch(url)
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (action === 'approve' && data.success) {
            var link = data.explorerUrl ? '<br/><a href="' + data.explorerUrl + '" target="_blank">View tx &#8599;</a>' : '';
            showToast('<strong>Approved &middot; XP minted</strong>' + link, 'success', 6000);
          } else if (action === 'reject' && data.success) {
            showToast('<strong>Submission rejected</strong>', 'success');
          } else {
            showToast('<strong>Failed:</strong> ' + (data.error || 'Unknown'), 'error', 5000);
          }
          loadSubmissions();
        })
        .catch(function(err){
          showToast('Action failed: ' + err.message, 'error');
          for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
        });
    }

    // ─── WIRING ───────────────────────────────────────
    window.addEventListener('load', function() {
      document.getElementById('login-btn').addEventListener('click', doLogin);
      document.getElementById('pw-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });

      var tabs = document.querySelectorAll('.filter-tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener('click', function(e) {
          setFilter(e.currentTarget.dataset.filter);
        });
      }

      var saved = sessionStorage.getItem('rialo_admin_pw');
      if (saved) {
        document.getElementById('pw-input').value = saved;
        doLogin();
      }
    });
  </script>
</body>
</html>
